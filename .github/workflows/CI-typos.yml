name: CI-typos

on: [push, pull_request]

jobs:
  spell-check:
    timeout-minutes: 20
    name: Spell Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check typos on code
        uses: crate-ci/typos@30eea72e385d435c00a24eeba0d96f87048f42ec # master
        with:
          config: ./typos.toml
